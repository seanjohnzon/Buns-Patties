<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your list · Proud Merchant</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
  /* The customer's list: a checklist of sections at the top, then one card per section with named boxes
     marked required or optional. Every box saves to our database as he types. Same shape as the sheet he approved. */
  :root{
    color-scheme: light;
    --paper:#F6F4EE; --card:#FFFFFF; --ink:#141A22; --ink2:#4F5863; --ink3:#8A919B;
    --line:#DCD8CF; --brass:#A8711A; --todo:#B3261E; --done:#2F6B4F; --tint:#ECE8DF;
    --sans:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --paper:#15181C; --card:#1E2228; --ink:#F2EFE8; --ink2:#AAB0B8; --ink3:#767D86;
      --line:#2E333A; --brass:#D59A3A; --todo:#E36B63; --done:#6DBF93; --tint:#242930;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --paper:#15181C; --card:#1E2228; --ink:#F2EFE8; --ink2:#AAB0B8; --ink3:#767D86;
    --line:#2E333A; --brass:#D59A3A; --todo:#E36B63; --done:#6DBF93; --tint:#242930;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:20px 60px}
  .wrap{max-width:680px;margin-inline:auto;display:grid;gap:14px}
  .brand{font-weight:800;font-size:17px;text-decoration:none;display:flex;align-items:center;gap:8px;color:var(--ink2)}
  .brand i{width:11px;height:11px;border-radius:2px;background:var(--brass);display:inline-block;transform:rotate(45deg)}
  h1{font-size:clamp(32px,8vw,46px);line-height:1;margin:6px 0 0;font-weight:800;letter-spacing:-.02em}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .progress{font-weight:600;font-size:15px;color:var(--done);font-variant-numeric:tabular-nums}
  .mailto{font-size:14.5px;color:var(--ink2);margin:0}
  .email{font-weight:600;color:var(--ink);word-break:break-all}
  .saving{font-size:13.5px;color:var(--ink3);min-height:1.2em}
  .saving.err{color:var(--todo)}

  .list{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 13px;display:grid}
  .list a{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600}
  .list a:last-child{border-bottom:0}
  .chip{font-weight:600;font-size:12px;border-radius:999px;padding:2px 10px;white-space:nowrap;background:var(--tint);color:var(--todo);letter-spacing:.02em}
  .chip.ok{background:var(--done);color:#fff}
  .chip.wait{background:var(--brass);color:#fff}

  .sec{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--todo);border-radius:10px;padding:14px 15px;display:grid;gap:12px;scroll-margin-top:12px}
  .sec.ok{border-left-color:var(--done)}
  .sec.wait{border-left-color:var(--brass)}
  .sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  h2{font-weight:800;font-size:21px;letter-spacing:-.01em;margin:0}
  .hint{color:var(--ink2);font-size:14.5px;margin:-6px 0 0}
  .go{justify-self:start;background:var(--ink);color:var(--paper);font-weight:600;font-size:14px;padding:7px 13px;border-radius:7px;text-decoration:none}

  .f{display:grid;gap:5px;min-width:0}
  .f-label{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-weight:600;font-size:15px}
  .same{display:inline-flex;align-items:center;gap:8px;font-size:15px;cursor:pointer;justify-self:start}
  .same input{width:22px;height:22px;margin:0;accent-color:var(--done)}
  .note{margin:0;color:var(--ink2);font-size:14px}
  .tag{font-weight:600;font-size:11px;padding:1px 7px;border-radius:4px;background:var(--tint);color:var(--ink3);letter-spacing:.02em}
  .tag.req{background:var(--todo);color:#fff}
  .f.filled .tag.req{background:var(--done)}
  .f input[type=text],.f textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%}
  .f textarea{min-height:70px;resize:vertical}
  .choice{display:flex;gap:8px;flex-wrap:wrap}
  .choice button{font:inherit;font-size:15px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
  .choice button[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:#fff;font-weight:600}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  h3{font-weight:800;font-size:17px;margin:10px 0 0;color:var(--ink2)}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:15px}
  td{padding:8px 12px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
  td.r{text-align:right;padding-right:0;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
  td span{color:var(--ink3);font-size:13px}
  .empty{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 16px}
  .empty a{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="./"><i></i>Proud Merchant</a>
    <div class="top"><h1 id="title">Your list</h1><span class="progress" id="progress"></span></div>
  </header>
  <p class="mailto" id="intro" hidden>Invites go to <span class="email">cihanshah.sahin@gmail.com</span>. Never send a password or a Square code.</p>
  <p class="saving" id="saving"></p>

  <div class="empty" id="empty" hidden>This link is not one of ours. Open the link we sent you, or <a href="./#start">get started</a>.</div>
  <nav class="list" id="list" aria-label="Sections"></nav>
  <div id="sections" style="display:grid;gap:14px"></div>

  <div id="costWrap" hidden>
    <h3>What it costs you</h3>
    <div class="scroll"><table><tbody id="costs"></tbody></table></div>
  </div>
</div>

<script>
(function(){
  var API = window.PM_API || {
    url: 'https://ecfscfmmgpefnpjqwbye.supabase.co', key: 'sb_publishable_3frQgbkFaZt7nCgVhHqdbQ_IwDF7jQd',
    rpc: function(name, body){
      return fetch(this.url + '/rest/v1/rpc/' + name, { method: 'POST', headers: { apikey: this.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.message || 'Something went wrong.'); return j; }); });
    }
  };
  var code = new URLSearchParams(location.search).get('c') || (location.hash || '').replace(/^#c?=?/, '');
  var saving = document.getElementById('saving');
  if (!code){ document.getElementById('empty').hidden = false; return; }

  API.rpc('get_account', { p_code: code }).then(function(acct){
    if (!acct){ document.getElementById('empty').hidden = false; return; }
    build(acct);
  }).catch(function(err){ saving.className = 'saving err'; saving.textContent = err.message; });

  function build(acct){
    var SHEET = acct.template, state = acct.answers || {}, tasks = acct.tasks || {};
    document.title = acct.name + ' · Proud Merchant';
    document.getElementById('title').textContent = acct.name;
    document.getElementById('intro').hidden = false;
    document.getElementById('costWrap').hidden = false;
    (SHEET.costs || []).forEach(function(c){
      var tr = el('tr'), td = el('td', '', c[0] + ' '); td.appendChild(el('span', '', '· ' + c[1]));
      tr.appendChild(td); tr.appendChild(el('td', 'r', c[2])); document.getElementById('costs').appendChild(tr);
    });

    var pending = {}, timers = {};
    function save(key){
      clearTimeout(timers[key]);
      timers[key] = setTimeout(function(){
        saving.className = 'saving'; saving.textContent = 'Saving…';
        API.rpc('save_answer', { p_code: code, p_key: key, p_value: state[key] || '' }).then(function(t){
          tasks = t || tasks; saving.textContent = 'Saved.'; paint();
          setTimeout(function(){ if (saving.textContent === 'Saved.') saving.textContent = ''; }, 1500);
        }).catch(function(err){ saving.className = 'saving err'; saving.textContent = 'Not saved: ' + err.message + ' Check your connection and type again.'; });
      }, 500);
    }
    function val(s, f){ if (f.sameAs && state[s.id + '.' + f.id + '.same'] === '1') return (state[s.id + '.' + f.sameAs] || '').trim(); return (state[s.id + '.' + f.id] || '').trim(); }
    function filled(s, f){ var v = val(s, f); return f.want ? v === f.want : v !== ''; }
    function shown(s, f){ return !f.when || (state[s.id + '.' + f.when[0]] || '') === f.when[1]; }
    function left(s){ return s.fields.filter(function(f){ return f.req && shown(s, f) && !filled(s, f); }).length; }

    var list = document.getElementById('list'), host = document.getElementById('sections'), progress = document.getElementById('progress');
    var chips = {};
    function paint(){
      var done = 0, total = 0;
      SHEET.sections.forEach(function(s){
        var opt = !s.fields.some(function(f){ return f.req; });
        var st = tasks[s.id];                       // the database's word; the page agrees with it
        var n = left(s), ok = opt ? s.fields.some(function(f){ return filled(s, f); }) : (st ? st === 'done' : n === 0);
        if (!opt){ total++; if (ok) done++; }
        var wait = !ok && (st === 'pending' || (s.pending && (state[s.id + '.' + s.pending[0]] || '') === s.pending[1]));
        chips[s.id].forEach(function(c){ c.textContent = opt ? (ok ? 'Added' : 'Optional') : (ok ? 'Done' : wait ? 'Pending' : n + ' left'); c.classList.toggle('ok', ok); c.classList.toggle('wait', !!wait); });
        document.getElementById('sec-' + s.id).classList.toggle('wait', !!wait);
        document.getElementById('sec-' + s.id).classList.toggle('ok', ok);
        s.fields.forEach(function(f){ var w = document.getElementById('f-' + s.id + '-' + f.id); w.classList.toggle('filled', filled(s, f)); w.hidden = !shown(s, f); });
      });
      progress.textContent = done + ' of ' + total + ' done';
    }

    SHEET.sections.forEach(function(s){
      var a = el('a', '', s.title); a.href = '#sec-' + s.id; var c1 = el('span', 'chip'); a.appendChild(c1); list.appendChild(a);
      var sec = el('section', 'sec'); sec.id = 'sec-' + s.id;
      var head = el('div', 'sec-head'); head.appendChild(el('h2', '', s.title)); var c2 = el('span', 'chip'); head.appendChild(c2); sec.appendChild(head);
      chips[s.id] = [c1, c2];
      if (s.hint) sec.appendChild(el('p', 'hint', s.hint));
      if (s.url){ var g = el('a', 'go', s.go || 'Open'); g.href = s.url; g.target = '_blank'; g.rel = 'noopener'; sec.appendChild(g); }
      s.fields.forEach(function(f){
        var key = s.id + '.' + f.id, id = 'in-' + s.id + '-' + f.id;
        var wrap = el('div', 'f'); wrap.id = 'f-' + s.id + '-' + f.id;
        var lab = el(f.choice ? 'div' : 'label', 'f-label', f.label); if (!f.choice) lab.htmlFor = id;
        lab.appendChild(el('span', 'tag' + (f.req ? ' req' : ''), f.req ? 'Required' : 'Optional'));
        wrap.appendChild(lab);
        if (f.url){ var fg = el('a', 'go', f.go || 'Open'); fg.href = f.url; fg.target = '_blank'; fg.rel = 'noopener'; wrap.appendChild(fg); }
        if (f.note) wrap.appendChild(el('p', 'note', f.note));
        if (f.choice){
          var ch = el('div', 'choice'); ch.setAttribute('role', 'group'); ch.setAttribute('aria-label', f.label);
          f.choice.forEach(function(c){
            var b = el('button', '', c); b.type = 'button'; b.setAttribute('aria-pressed', String(state[key] === c));
            b.addEventListener('click', function(){
              state[key] = (state[key] === c) ? '' : c; save(key);
              ch.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', String(x.textContent === state[key])); });
              paint();
            });
            ch.appendChild(b);
          });
          wrap.appendChild(ch);
        } else {
          var inp = el(f.area ? 'textarea' : 'input'); if (!f.area) inp.type = 'text';
          inp.id = id; inp.placeholder = f.ph || ''; inp.value = state[key] || '';
          inp.addEventListener('input', function(){ state[key] = inp.value; save(key); paint(); });
          if (f.sameAs){
            var sl = el('label', 'same'), sc = el('input'); sc.type = 'checkbox'; sc.id = id + '-same'; sc.checked = state[key + '.same'] === '1';
            sl.appendChild(sc); sl.appendChild(document.createTextNode(f.sameLabel || 'Same as above'));
            inp.hidden = sc.checked;
            sc.addEventListener('change', function(){ state[key + '.same'] = sc.checked ? '1' : ''; inp.hidden = sc.checked; save(key + '.same'); paint(); });
            wrap.appendChild(sl);
          }
          wrap.appendChild(inp);
        }
        sec.appendChild(wrap);
      });
      host.appendChild(sec);
    });
    paint();
  }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
})();
</script>
</body>
</html>
