# proudmerchant.com: plain files, no build. On Netlify set the base directory to
# "proud-merchant" and this file does the rest. The database it talks to is the
# company project "proud-merchant" on Supabase, with its publishable key (made
# to be seen); nothing secret is in these pages.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/account.html"
  [headers.values]
    X-Robots-Tag = "noindex"
