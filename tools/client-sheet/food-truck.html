<title>Food Truck Setup Template</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Staatliches&family=Karla:wght@400;600;700&display=swap">
<style>
  /* Layout: a checklist of sections at the top, then one card per section. Each card holds named boxes marked required or optional, and marks itself done when the required ones are filled. */
  :root{
    color-scheme: light;
    --paper:#FAF8F5; --card:#FFFFFF; --ink:#16120F; --ink2:#5E554E; --ink3:#8C8279;
    --line:#E4DCD2; --cheese:#C77F05; --heat:#C1322B; --ok:#2C6E49; --tint:#F2EEE9;
    --display:"Staatliches","Haettenschweiler","Arial Narrow",sans-serif;
    --body:"Karla","Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --paper:#121010; --card:#1C1918; --ink:#F4EFE9; --ink2:#A79C92; --ink3:#7E746B;
      --line:#332D29; --cheese:#F0B23C; --heat:#E4645C; --ok:#6BBF8A; --tint:#231F1E;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --paper:#121010; --card:#1C1918; --ink:#F4EFE9; --ink2:#A79C92; --ink3:#7E746B;
    --line:#332D29; --cheese:#F0B23C; --heat:#E4645C; --ok:#6BBF8A; --tint:#231F1E;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:28px 60px;}
  .wrap{max-width:680px;margin-inline:auto;display:grid;gap:14px;}
  .kicker{font-family:var(--display);letter-spacing:.15em;font-size:12px;color:var(--ink2);}
  h1{font-family:var(--display);font-size:clamp(32px,8vw,50px);line-height:.95;margin:2px 0 0;font-weight:400;}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .progress{font-family:var(--display);letter-spacing:.08em;font-size:15px;color:var(--ok);}
  .mailto{font-size:14.5px;color:var(--ink2);margin:0;}
  .email{font-family:var(--mono);font-weight:700;color:var(--ink);word-break:break-all;}

  .list{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 13px;display:grid;}
  .list a{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:700;}
  .list a:last-child{border-bottom:0;}
  .chip{font-family:var(--display);font-weight:400;letter-spacing:.07em;font-size:12.5px;border-radius:999px;padding:2px 10px;white-space:nowrap;background:var(--tint);color:var(--heat);}
  .chip.ok{background:var(--ok);color:#fff;}
  .chip.wait{background:var(--cheese);color:#fff;}

  .sec{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--heat);border-radius:8px;padding:14px 15px;display:grid;gap:12px;scroll-margin-top:12px;}
  .sec.ok{border-left-color:var(--ok);}
  .sec.wait{border-left-color:var(--cheese);}
  .sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
  h2{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.04em;margin:0;}
  .hint{color:var(--ink2);font-size:14.5px;margin:-6px 0 0;}
  .go{justify-self:start;background:var(--ink);color:var(--paper);font-family:var(--display);letter-spacing:.05em;font-size:14px;padding:7px 13px;border-radius:6px;text-decoration:none;}

  .f{display:grid;gap:5px;min-width:0;}
  .f-label{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-weight:700;font-size:15px;}
  .same{display:inline-flex;align-items:center;gap:8px;font-size:15px;cursor:pointer;justify-self:start;}
  .same input{width:22px;height:22px;margin:0;accent-color:var(--ok);}
  .note{margin:0;color:var(--ink2);font-size:14px;}
  .tag{font-family:var(--display);font-weight:400;letter-spacing:.08em;font-size:11px;padding:1px 7px;border-radius:3px;background:var(--tint);color:var(--ink3);}
  .tag.req{background:var(--heat);color:#fff;}
  .f.filled .tag.req{background:var(--ok);}
  .f input[type=text],.f textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;}
  .f textarea{min-height:70px;resize:vertical;}
  .choice{display:flex;gap:8px;flex-wrap:wrap;}
  .choice button{font:inherit;font-size:15px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;}
  .choice button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700;}
  :focus-visible{outline:2px solid var(--cheese);outline-offset:2px;}

  h3{font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.05em;margin:10px 0 0;color:var(--ink2);}
  .scroll{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;font-size:15px;}
  td{padding:8px 12px 8px 0;border-bottom:1px solid var(--line);vertical-align:top;}
  td.r{text-align:right;padding-right:0;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums;}
  td span{color:var(--ink3);font-size:13px;}

  .send{display:grid;gap:8px;margin-top:6px;}
  .send button{justify-self:start;font-family:var(--display);letter-spacing:.06em;font-size:17px;background:var(--ok);color:#fff;border:0;border-radius:6px;padding:12px 20px;cursor:pointer;}
  .send .msg{color:var(--ink2);font-size:14.5px;}
  #out{width:100%;min-height:160px;font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;}
</style>

<div class="wrap">
  <header>
    <span class="kicker" id="kicker"></span>
    <div class="top"><h1>Setup</h1><span class="progress" id="progress"></span></div>
  </header>
  <p class="mailto">Invites go to <span class="email" id="ourEmail"></span>. Never send a password or a Square code.</p>

  <nav class="list" id="list" aria-label="Sections"></nav>
  <div id="sections" style="display:grid;gap:14px"></div>

  <h3>COSTS</h3>
  <div class="scroll"><table><tbody id="costs"></tbody></table></div>

  <div class="send">
    <button type="button" id="copy">COPY EVERYTHING</button>
    <span class="msg" id="msg">Saves on this phone as you type. Copy, then paste it to us in WhatsApp.</span>
    <textarea id="out" readonly hidden></textarea>
  </div>
</div>

<script>
(function(){
  /* SHEET-START: the FOOD TRUCK template. A new food truck is this one object. Nothing else on the page changes.
     (Gas stations and restaurants get their own copy of this file later; most sections stay the same.)
     Rules: one section per account or topic. Every box is named for exactly what goes in it.
     req:1 = required. want:'Done' = required answer. A hint is one short line or nothing.
     Order the account sections by how long approval takes. */
  var SHEET = {
    key: 'client-sheet-v3',
    name: '[Client name]',
    email: 'cihanshah.sahin@gmail.com',
    costs: [
      ['Apple Developer','Apple','$99 / year'],
      ['Google Play','Google','$25 once'],
      ['Card payments','Square or Stripe, per app order','2.9% + 30¢'],
      ['Web address','the registrar, in your name','~$12 / year'],
      ['Running the app','us, [at cost / our fee]','[amount] / month']
    ],
    sections: [
      {id:'business', title:'Your business', fields:[
        {id:'legal', label:'Legal business name', ph:'Exactly as registered', req:1},
        {id:'type', label:'Business type', choice:['LLC','Corporation','Sole proprietor'], req:1}
      ]},
      {id:'web', title:'Web address or domain', hint:'The QR sticker opens it, and Apple needs a business website and an email on it. Buy it in your own name.', url:'https://porkbun.com/', go:'Get one', fields:[
        {id:'domain', label:'Your web address or domain', ph:'yourname.com', req:1}
      ]},
      {id:'duns', title:'D-U-N-S number', hint:'Free. Request it under the exact legal name.', url:'https://developer.apple.com/enroll/duns-lookup/', go:'Get it', fields:[
        {id:'number', label:'D-U-N-S number', ph:'9 digits', req:1}
      ]},
      {id:'apple', title:'Apple', hint:'Enroll as Company / Organization. Then add us as App Manager.', url:'https://developer.apple.com/programs/enroll/', go:'Enroll', fields:[
        {id:'appleid', label:'Your Apple ID email', ph:'The one on your iPhone', req:1},
        {id:'email', label:'Email the developer account is under', sameAs:'appleid', sameLabel:'Same as my Apple ID email', req:1},
        {id:'invited', label:'Added us as App Manager', url:'https://appstoreconnect.apple.com/access/users', go:'Open Users and Access', note:'Tap +, enter cihanshah.sahin@gmail.com, choose App Manager, tick Access to Certificates, Identifiers & Profiles, then Invite.', choice:['Done'], req:1, want:'Done'}
      ]},
      {id:'play', title:'Google Play', hint:'Sign up as Organisation, not Personal. Then add us as Admin.', url:'https://play.google.com/console/signup', go:'Sign up', fields:[
        {id:'name', label:'Developer account name', ph:'As shown in Play Console', req:1},
        {id:'invited', label:'Added us as Admin', url:'https://play.google.com/console/developers/users-and-permissions', go:'Open Users and permissions', note:'Invite new users, enter cihanshah.sahin@gmail.com, Account permissions, tick Admin, then Invite user.', choice:['Done'], req:1, want:'Done'}
      ]},
      {id:'maps', title:'Google Maps listing', hint:'[What to fix on theirs, or: create one].', url:'https://business.google.com/', go:'Open', pending:['status','Change requested'], fields:[
        {id:'status', label:'Where it stands', choice:['Change requested','Up to date'], req:1, want:'Up to date', note:'Changes take Google a few weeks. Come back and switch it when it is live.'},
        {id:'link', label:'Link to your listing', ph:'In Google Maps: Share, then Copy link', req:1}
      ]},
      {id:'pay', title:'Card payments', hint:'No keys or passwords.', fields:[
        {id:'provider', label:'Take card payments through', choice:['Square','Stripe'], req:1},
        {id:'sq_email', label:'Square account email', ph:'The email you sign in to Square with', req:1, when:['provider','Square']},
        {id:'st_email', label:'Stripe account email', ph:'', req:1, when:['provider','Stripe']},
        {id:'st_invited', label:'Added us as Developer', url:'https://dashboard.stripe.com/settings/team', go:'Open Team', note:'New member, enter cihanshah.sahin@gmail.com, role Developer, Send invite.', choice:['Done'], req:1, want:'Done', when:['provider','Stripe']}
      ]},
      {id:'truck', title:'The truck', fields:[
        {id:'where', label:'Where you park', ph:'Address', req:1},
        {id:'hours', label:'Hours', ph:'Days and times', area:1, req:1},
        {id:'phone', label:'Phone customers call', ph:'', req:1},
        {id:'cemail', label:'Email customers write to', ph:''},
        {id:'story', label:'Your story', ph:'3–5 sentences, shown in the app', area:1, req:1}
      ]},
      {id:'menu', title:'Menu', hint:'A photo or PDF of your current menu, with prices.', fields:[
        {id:'file', label:'Your menu', ph:'Link to a photo or PDF of your menu', req:1}
        /* Already have the client's menu? Add def:'<file name> (received <date>)' and it opens as done. */
      ]},
      {id:'links', title:'Links and reviews', fields:[
        {id:'tiktok', label:'TikTok', ph:'Link'},
        {id:'facebook', label:'Facebook', ph:'Link'},
        {id:'doordash', label:'DoorDash', ph:'Link'},
        {id:'ubereats', label:'Uber Eats', ph:'Link'},
        {id:'grubhub', label:'Grubhub', ph:'Link'},
        {id:'reviews', label:'Google reviews to show', ph:'3–5: the text and the first name', area:1}
      ]},
      {id:'photos', title:'Food photos', hint:'One per menu item. Put them in one shared album.', fields:[
        {id:'album', label:'Link to the album', ph:'Google Photos, iCloud or Drive link', req:1}
      ]}
    ]
  };
  /* SHEET-END */

  var state = {};
  try { state = JSON.parse(localStorage.getItem(SHEET.key) || '{}') || {}; } catch(e){ state = {}; }
  function save(){ try { localStorage.setItem(SHEET.key, JSON.stringify(state)); } catch(e){} }
  function val(s, f){ if (f.sameAs && state[s.id + '.' + f.id + '.same'] === '1') return (state[s.id + '.' + f.sameAs] || '').trim(); return (state[s.id + '.' + f.id] || '').trim(); }
  function filled(s, f){ var v = val(s, f); return f.want ? v === f.want : v !== ''; }
  function shown(s, f){ return !f.when || (state[s.id + '.' + f.when[0]] || '') === f.when[1]; }
  function left(s){ return s.fields.filter(function(f){ return f.req && shown(s, f) && !filled(s, f); }).length; }
  SHEET.sections.forEach(function(s){ s.fields.forEach(function(f){ var k = s.id + '.' + f.id; if (f.def && state[k] === undefined) state[k] = f.def; }); });
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  document.getElementById('kicker').textContent = SHEET.name.toUpperCase() + ' APP';
  document.getElementById('ourEmail').textContent = SHEET.email;
  SHEET.costs.forEach(function(c){
    var tr = el('tr'), td = el('td', '', c[0] + ' '); td.appendChild(el('span', '', '· ' + c[1]));
    tr.appendChild(td); tr.appendChild(el('td', 'r', c[2])); document.getElementById('costs').appendChild(tr);
  });

  var list = document.getElementById('list'), host = document.getElementById('sections'), progress = document.getElementById('progress');
  var chips = {};

  function paint(){
    var done = 0, total = 0;
    SHEET.sections.forEach(function(s){
      var n = left(s), ok = n === 0, opt = !s.fields.some(function(f){ return f.req; });
      if (opt) { ok = s.fields.some(function(f){ return filled(s, f); }); } else { total++; if (ok) done++; }
      var wait = !ok && s.pending && (state[s.id + '.' + s.pending[0]] || '') === s.pending[1];
      chips[s.id].forEach(function(c){ c.textContent = opt ? (ok ? 'ADDED' : 'OPTIONAL') : (ok ? 'DONE' : wait ? 'PENDING' : n + ' LEFT'); c.classList.toggle('ok', ok); c.classList.toggle('wait', !!wait); });
      document.getElementById('sec-' + s.id).classList.toggle('wait', !!wait);
      document.getElementById('sec-' + s.id).classList.toggle('ok', ok);
      s.fields.forEach(function(f){ var w = document.getElementById('f-' + s.id + '-' + f.id); w.classList.toggle('filled', filled(s, f)); w.hidden = !shown(s, f); });
    });
    progress.textContent = done + ' OF ' + total + ' DONE';
  }

  SHEET.sections.forEach(function(s){
    var a = el('a', '', s.title); a.href = '#sec-' + s.id; var c1 = el('span', 'chip'); a.appendChild(c1); list.appendChild(a);
    var sec = el('section', 'sec'); sec.id = 'sec-' + s.id;
    var head = el('div', 'sec-head'); head.appendChild(el('h2', '', s.title)); var c2 = el('span', 'chip'); head.appendChild(c2); sec.appendChild(head);
    chips[s.id] = [c1, c2];
    if (s.hint) sec.appendChild(el('p', 'hint', s.hint));
    if (s.url){ var g = el('a', 'go', s.go || 'Open'); g.href = s.url; g.target = '_blank'; g.rel = 'noopener'; sec.appendChild(g); }
    s.fields.forEach(function(f){
      var key = s.id + '.' + f.id, id = 'in-' + s.id + '-' + f.id;
      var wrap = el('div', 'f'); wrap.id = 'f-' + s.id + '-' + f.id;
      var lab = el(f.choice ? 'div' : 'label', 'f-label', f.label); if (!f.choice) lab.htmlFor = id;
      lab.appendChild(el('span', 'tag' + (f.req ? ' req' : ''), f.later ? 'LATER' : f.req ? 'REQUIRED' : 'OPTIONAL'));
      wrap.appendChild(lab);
      if (f.url){ var fg = el('a', 'go', f.go || 'Open'); fg.href = f.url; fg.target = '_blank'; fg.rel = 'noopener'; wrap.appendChild(fg); }
      if (f.note) wrap.appendChild(el('p', 'note', f.note));
      if (f.later){ /* nothing to fill yet */ }
      else if (f.choice){
        var ch = el('div', 'choice'); ch.setAttribute('role', 'group'); ch.setAttribute('aria-label', f.label);
        f.choice.forEach(function(c){
          var b = el('button', '', c); b.type = 'button'; b.setAttribute('aria-pressed', String(state[key] === c));
          b.addEventListener('click', function(){
            state[key] = (state[key] === c) ? '' : c; save();
            ch.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', String(x.textContent === state[key])); });
            paint();
          });
          ch.appendChild(b);
        });
        wrap.appendChild(ch);
      } else {
        var inp = el(f.area ? 'textarea' : 'input'); if (!f.area) inp.type = 'text';
        inp.id = id; inp.placeholder = f.ph || ''; inp.value = state[key] || '';
        inp.addEventListener('input', function(){ state[key] = inp.value; save(); paint(); });
        if (f.sameAs){
          var sl = el('label', 'same'), sc = el('input'); sc.type = 'checkbox'; sc.id = id + '-same'; sc.checked = state[key + '.same'] === '1';
          sl.appendChild(sc); sl.appendChild(document.createTextNode(f.sameLabel || 'Same as above'));
          inp.hidden = sc.checked;
          sc.addEventListener('change', function(){ state[key + '.same'] = sc.checked ? '1' : ''; inp.hidden = sc.checked; save(); paint(); });
          wrap.appendChild(sl);
        }
        wrap.appendChild(inp);
      }
      sec.appendChild(wrap);
    });
    host.appendChild(sec);
  });
  paint();

  var out = document.getElementById('out'), msg = document.getElementById('msg');
  document.getElementById('copy').addEventListener('click', function(){
    var lines = [SHEET.name + ' setup'], missing = 0;
    SHEET.sections.forEach(function(s){
      lines.push('', s.title.toUpperCase());
      s.fields.forEach(function(f){
        var v = val(s, f);
        if (f.later || !shown(s, f) || (!v && !f.req)) return;
        if (f.req && !filled(s, f)) missing++;
        lines.push(f.label + ': ' + (v || 'MISSING'));
      });
    });
    var text = lines.join('\n');
    out.value = text; out.hidden = false;
    var tail = missing ? ' ' + missing + ' required still empty.' : '';
    var fallback = function(){ out.focus(); out.select(); msg.textContent = 'Select all below, copy, and paste it to us.' + tail; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ msg.textContent = 'Copied. Paste it to us in WhatsApp.' + tail; }, fallback);
    } else { fallback(); }
  });
})();
</script>
