# Proves the website builds before the host tries. Runs on every push to the
# test branch and to main, with the same command the host (Netlify) runs.
# A branch with a tracked .env (test-env) builds with it, the same public values
# the phone build gets, and the job checks that Expo picked the file up. main has
# no .env, so stand-in values keep its build honest: this job only checks that
# the build works and that the pages a customer lands on after paying are in it.
name: Site build

on:
  push:
    branches: [test-env, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the website
        run: |
          set -o pipefail
          if [ ! -f .env ]; then
            export EXPO_PUBLIC_ENV=sit
            export EXPO_PUBLIC_SUPABASE_URL=https://example.supabase.co
            export EXPO_PUBLIC_SUPABASE_ANON_KEY=stand-in
          fi
          npm run build:web 2>&1 | tee build.log
      - name: The branch's .env reached the build
        if: hashFiles('.env') != ''
        run: |
          grep -F "env: load .env" build.log
          grep -E "env: export .*EXPO_PUBLIC_SUPABASE_URL" build.log
      - name: The pages a customer comes back to are there
        run: |
          test -f dist/index.html
          test -f "dist/order/[id].html"
          test -f "dist/item/[id].html"
          du -sh dist
